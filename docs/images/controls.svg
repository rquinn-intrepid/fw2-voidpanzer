<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Consolas, 'DejaVu Sans Mono', monospace">
  <rect width="720" height="360" rx="16" fill="#05070a"/>
  <rect x="30" y="30" width="400" height="300" rx="18" fill="#1b1f26" stroke="#3a414c" stroke-width="2"/>
  <!-- screen: horizon, grid, enemy tank, reticle, radar -->
  <rect x="55" y="50" width="350" height="200" rx="4" fill="#000" stroke="#1e3a24"/>
  <polyline points="55,140 95,128 140,134 180,118 230,130 270,114 320,126 360,120 405,132"
            fill="none" stroke="#00ff41" stroke-width="1.5"/>
  <g stroke="#0a5a1e" stroke-width="1">
    <line x1="55" y1="160" x2="405" y2="160"/><line x1="55" y1="180" x2="405" y2="180"/>
    <line x1="55" y1="215" x2="405" y2="215"/>
    <line x1="230" y1="150" x2="120" y2="250"/><line x1="230" y1="150" x2="340" y2="250"/>
    <line x1="230" y1="150" x2="230" y2="250"/>
  </g>
  <g stroke="#00ff41" stroke-width="1.5" fill="none">
    <path d="M214,160 L246,160 L242,152 L218,152 Z"/><path d="M222,152 L224,146 L236,146 L238,152"/>
    <line x1="230" y1="149" x2="256" y2="148"/>
    <path d="M300,160 L320,120 L340,160 Z"/><rect x="120" y="120" width="10" height="40"/>
    <circle cx="230" cy="78" r="20"/>
  </g>
  <g stroke="#fff" stroke-width="1.5" fill="none">
    <path d="M212,146 L212,166 M212,146 L218,146 M212,166 L218,166 M248,146 L248,166 M248,146 L242,146 M248,166 L242,166"/>
  </g>
  <circle cx="236" cy="70" r="2" fill="#f55"/>
  <!-- d-pad -->
  <g transform="translate(110,290)">
    <rect x="-9" y="-27" width="18" height="54" rx="4" fill="#2b313b" stroke="#00ff41"/>
    <rect x="-27" y="-9" width="54" height="18" rx="4" fill="#2b313b" stroke="#00ff41"/>
    <text x="0" y="-13" fill="#00ff41" font-size="12" text-anchor="middle">&#9650;</text>
    <text x="0" y="23" fill="#00ff41" font-size="12" text-anchor="middle">&#9660;</text>
    <text x="-20" y="5" fill="#00ff41" font-size="12" text-anchor="middle">&#9664;</text>
    <text x="20" y="5" fill="#00ff41" font-size="12" text-anchor="middle">&#9654;</text>
  </g>
  <text x="110" y="335" fill="#9aa" font-size="11" text-anchor="middle">D-pad</text>
  <!-- button row -->
  <g font-size="10" text-anchor="middle">
    <rect x="58"  y="258" width="62" height="0" fill="none"/>
    <rect x="160" y="266" width="48" height="26" rx="5" fill="#d0d0d0"/><text x="184" y="283" fill="#000">MISSILE</text>
    <rect x="212" y="266" width="48" height="26" rx="5" fill="#e8d000"/><text x="236" y="283" fill="#000">REV</text>
    <rect x="264" y="266" width="48" height="26" rx="5" fill="#1aa64a"/><text x="288" y="283" fill="#fff">DRIVE</text>
    <rect x="316" y="266" width="48" height="26" rx="5" fill="#2a63d6"/>
    <rect x="368" y="266" width="48" height="26" rx="5" fill="#d23a3a"/><text x="392" y="283" fill="#fff">FIRE</text>
  </g>
  <!-- legend -->
  <g font-size="14" fill="#cfe">
    <text x="455" y="58" fill="#00ff41" font-size="16">CONTROLS</text>
    <text x="455" y="86">Turn / tilt board  steer</text>
    <text x="455" y="110"><tspan fill="#00ff41">D-pad UP</tspan>    forward</text>
    <text x="455" y="130"><tspan fill="#00ff41">D-pad DOWN</tspan>  reverse</text>
    <text x="455" y="150"><tspan fill="#00ff41">D-pad L/R</tspan>   turn</text>
    <text x="455" y="174"><tspan fill="#4cd27a">GREEN</tspan> forward  <tspan fill="#ffe14d">YELLOW</tspan> rev</text>
    <text x="455" y="200"><tspan fill="#ff6b6b">RED</tspan>   cannon (tap)</text>
    <text x="455" y="216" font-size="11" fill="#9aa">      one shell per press, unlimited</text>
    <text x="455" y="240"><tspan fill="#d0d0d0">GRAY</tspan>  proximity missile</text>
    <text x="455" y="256" font-size="11" fill="#9aa">      4 per tank, kills near misses</text>
    <text x="455" y="282">PAGE 5 s About   HOME 5 s exit</text>
    <text x="455" y="310" font-size="12" fill="#ff8080">Never hold RED 6 s: power off</text>
  </g>
</svg>
